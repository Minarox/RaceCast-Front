services:
    racecast:
        build:
            context: .
            args:
                # Baked in at build time: changing it means rebuilding the image.
                SITE_URL: ${SITE_URL:-https://racecast.minarox.fr}
        image: racecast-front
        container_name: racecast-front
        restart: unless-stopped

        # LiveKit credentials and the optional map settings, read at runtime.
        # Only what is set in .env is passed, so unset options keep the app's
        # defaults (see .env.example).
        env_file: .env
        environment:
            PORT: 4321

        # Plain HTTP, for the reverse proxy that terminates TLS. The proxy runs
        # on another machine of the LAN, so the port is published on every
        # interface by default; set BIND_ADDRESS to the host's LAN address to
        # narrow it, or to 127.0.0.1 for a proxy on this same host. Only the
        # proxy should reach it: a client talking to it directly skips TLS and
        # can forge X-Forwarded-For.
        ports:
            - "${BIND_ADDRESS:-0.0.0.0}:4321:4321"
